<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Boss 27</title>
<style>
:root{--bg:#07111c;--panel:#132437;--panel2:#1b3046;--line:#304a62;--txt:#f3f7fc;--muted:#a8bacb;--green:#67e2a0;--gold:#f4ce70;--blue:#75c5ff;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#183c4b,transparent 38%),linear-gradient(140deg,#07111c,#0b1b2b 65%,#10192a);color:var(--txt);font:14px system-ui,Arial}
header{padding:13px 15px;background:#07111dee;position:sticky;top:0;z-index:4;border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-size:22px;font-weight:1000;letter-spacing:1px}.logo em{color:var(--green);font-style:normal}.sub{font-size:9px;color:var(--muted);letter-spacing:1.5px}.season{font-size:10px;color:var(--gold);font-weight:800}
main{max-width:900px;margin:auto;padding:13px 12px 100px}.hero{padding:17px;border-radius:17px;border:1px solid #4c7860;background:linear-gradient(110deg,#14503b,#17455b 60%,#2d3153);position:relative;overflow:hidden}.hero:after{content:"🏆";font-size:120px;position:absolute;right:8px;bottom:-25px;opacity:.18}.clubrow{display:flex;align-items:center;gap:12px;position:relative;z-index:1}.crest{width:58px;height:66px;display:grid;place-items:center;clip-path:polygon(5% 0,95% 0,88% 73%,50% 100%,12% 73%);background:linear-gradient(145deg,#ffe39a,#bb8127);color:#14273b;font-weight:1000;font-size:24px}.hero h1{font-size:21px;margin:0}.hero p{font-size:11px;color:#d8eee2;position:relative;z-index:1;margin-bottom:0}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.metric,.panel,.tile{border:1px solid var(--line);background:linear-gradient(145deg,#172b40,#101d2c);border-radius:12px;padding:11px}.metric label{display:block;font-size:9px;color:var(--muted);letter-spacing:1px}.metric b{display:block;font-size:18px;margin-top:3px}.metric:nth-child(1) b{color:var(--gold)}.metric:nth-child(3) b{color:var(--green)}
h2{font-size:15px;margin:16px 0 9px}.muted{color:var(--muted)}.small{font-size:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tile{min-height:74px;text-align:left;color:var(--txt);cursor:pointer}.tile b{display:block;margin-top:5px}.tile small{display:block;color:var(--muted);margin-top:3px}
button,select,input{font:inherit;color:var(--txt);background:#203850;border:1px solid #405c77;border-radius:9px;padding:9px}button{font-weight:750;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:linear-gradient(110deg,#168653,#246e9b);border-color:#56bd8d}.gold{background:linear-gradient(110deg,#86601e,#b28a36);border-color:#e0bb62}.danger{background:#542b32;border-color:#94515b}select,input{width:100%;margin:5px 0 10px;background:#0c1927}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.listrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #2b4157}.listrow:last-child{border:0}.rating{font-weight:900;color:var(--gold)}.tag{font-size:9px;color:#aaf0c5;border:1px solid #3d7555;background:#183a2b;padding:4px 7px;border-radius:20px}.coach{display:flex;gap:12px;align-items:center}.portrait{width:85px;height:100px;flex-shrink:0;border-radius:12px;border:2px solid #59778e;background:#27425a}.portrait svg{width:100%;height:100%}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:7px;background:#07111df2;border-top:1px solid var(--line);z-index:5}nav button{flex:1;max-width:130px;font-size:10px;padding:9px 2px}
.fixture{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #2b4157;gap:8px}.score{font-size:20px;font-weight:1000;color:var(--gold)}.pitch{border:2px solid #7cbb8e;border-radius:12px;background:repeating-linear-gradient(0deg,#17613f,#17613f 36px,#1b7048 36px,#1b7048 72px);padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pos{background:#092b2cbb;border:1px solid #b8eac6aa;border-radius:8px;padding:8px 2px;text-align:center;font-size:10px}
.trophyline{display:flex;align-items:center;gap:12px}.trophy{font-size:42px;filter:drop-shadow(0 4px 5px #0008)}.notice{font-size:10px;color:#f0d48c;margin-top:8px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tabs button{font-size:11px}
@media(max-width:470px){.metrics{grid-template-columns:repeat(2,1fr)}.logo{font-size:19px}.metric b{font-size:17px}}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071b2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Club Boss 27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
\n</head><body>
<header><div class="top"><div><div class="logo">CLUB <em>BOSS</em> 27</div><div class="sub">FOOTBALL CLUB MANAGEMENT SIMULATOR</div></div><div class="season" id="seasonLabel">2026/27</div></div></header><main id="app"></main>
<nav><button onclick="show('home')">🏠 Home</button><button onclick="show('squad')">👥 Squad</button><button onclick="show('tactics')">📋 Tactics</button><button onclick="show('matches')">⚽ Matches</button><button onclick="show('transfers')">🔁 Transfers</button><button onclick="show('more')">☰ More</button></nav>
<script>
const $=id=>document.getElementById(id);
const S={club:'Harbour City FC',manager:'Alex Morgan',season:2026,week:1,played:0,wins:0,draws:0,losses:0,points:0,cash:28.5,wages:486,morale:82,rep:3,formation:'4-2-3-1',style:'Balanced',training:'Balanced',last:'No matches played yet.',news:'The board welcomes you. Build a strong squad and bring trophies to Harbour City.',trophies:[],table:[],cupRound:0,
players:[
['A. Mensah','GK',25,76,80,24],['J. Okoro','RB',22,72,81,17],['M. Silva','CB',28,78,78,32],['T. Adeyemi','CB',23,75,84,21],['L. James','LB',24,73,80,18],['K. Bello','DM',26,77,80,27],['D. Costa','CM',25,80,83,36],['S. Ibrahim','RW',21,76,87,22],['R. Williams','AM',27,79,80,33],['P. Nwosu','LW',20,74,88,17],['E. Martin','ST',24,81,86,39],['B. Clarke','GK',19,65,82,5],['F. Okafor','CM',18,64,89,5]
].map(p=>({name:p[0],pos:p[1],age:p[2],ovr:p[3],pot:p[4],wage:p[5]})),
market:[
['I. Petrov','CB',20,71,86,3.4,13],['M. Diallo','ST',22,75,85,6.2,22],['N. Adebayo','DM',19,67,90,1.8,8],['L. Moretti','RW',25,78,81,7.5,29],['C. Mensah','LB',21,73,84,4.2,15],['J. Park','AM',19,70,88,3.1,12],['R. Costa','GK',27,79,80,5.5,26]
].map(p=>({name:p[0],pos:p[1],age:p[2],ovr:p[3],pot:p[4],fee:p[5],wage:p[6]})),
opponents:['Northbridge FC','Kingsport United','Redwood Athletic','Eastvale Town','Metro Rovers','Lakeside FC','Westford City','Capital Sporting','Stonehaven','Riverside Albion','Oldcastle FC','Summit United','Portside FC','Greenwich Athletic','Ironhill FC','Southbank City','Bluewater FC','Highland Wanderers','Crown FC'],
comps:[
{name:'Premier League',icon:'🏆',kind:'League',prize:18,status:'Active',matches:38},
{name:'FA Cup',icon:'🏆',kind:'Domestic Cup',prize:8,status:'Active',matches:6},
{name:'League Cup',icon:'🥇',kind:'Domestic Cup',prize:5,status:'Active',matches:5},
{name:'Champions League',icon:'⭐',kind:'Continental',prize:35,status:'Locked',matches:13},
{name:'Europa League',icon:'🌟',kind:'Continental',prize:18,status:'Locked',matches:13},
{name:'Conference League',icon:'🌍',kind:'Continental',prize:10,status:'Locked',matches:13},
{name:'Community Shield',icon:'🛡️',kind:'Super Cup',prize:2,status:'Locked',matches:1},
{name:'Pre-season Invitational',icon:'🌐',kind:'Friendly Cup',prize:1,status:'Available',matches:3}
]};
function avg(){return Math.round(S.players.reduce((a,p)=>a+p.ovr,0)/S.players.length)}
function metrics(){return `<div class="metrics"><div class="metric"><label>TRANSFER BUDGET</label><b>£${S.cash.toFixed(1)}m</b></div><div class="metric"><label>WEEKLY WAGES</label><b>£${S.wages}k</b></div><div class="metric"><label>SQUAD RATING</label><b>${avg()}</b></div><div class="metric"><label>TEAM MORALE</label><b>${S.morale}%</b></div></div>`}
function header(){return `<div class="hero"><div class="clubrow"><div class="crest">${S.club.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><h1>${S.club}</h1><div class="small">Manager: ${S.manager}</div><div class="small">Season ${S.season}/${String(S.season+1).slice(-2)} · Board confidence ${S.rep}/5</div></div></div><p>Make the decisions. Manage the club. Chase every trophy.</p></div>${metrics()}`}
function show(p){let a=$('app');$('seasonLabel').textContent=S.season+'/'+String(S.season+1).slice(-2);
if(p==='home'){a.innerHTML=header()+`<h2>Manager's office</h2><div class="grid"><button class="tile" onclick="show('squad')">👥<b>First-team squad</b><small>Players, ratings, potential and contracts</small></button><button class="tile" onclick="show('matches')">⚽<b>Next match</b><small>Prepare and simulate fixtures</small></button><button class="tile" onclick="show('transfers')">🔁<b>Transfer market</b><small>Buy and sell players</small></button><button class="tile" onclick="show('tactics')">📋<b>Team tactics</b><small>Formation and match approach</small></button><button class="tile" onclick="show('competitions')">🏆<b>Tournaments</b><small>Leagues, cups and continental competitions</small></button><button class="tile" onclick="show('club')">🏢<b>Club management</b><small>Finances, facilities and board</small></button></div><h2>Manager profile</h2><div class="panel coach"><div class="portrait"><svg viewBox="0 0 100 120"><rect width="100" height="120" fill="#27425a"/><path d="M10 120Q12 76 38 72H62Q88 78 91 120" fill="#152333"/><path d="M30 42Q27 10 51 10Q76 12 72 47L67 68Q52 84 35 67Z" fill="#bd805b"/><path d="M29 41Q22 5 52 5Q82 7 74 43L66 27Q48 34 31 26Z" fill="#30251f"/><path d="M39 48q6 4 11 0m7 0q6 4 10 0" stroke="#39251f" stroke-width="2" fill="none"/><path d="M44 63q9 5 18-1" stroke="#713d36" stroke-width="2" fill="none"/><path d="M39 73L50 90 62 73" fill="#eee"/><path d="M50 90L44 120H57L51 90" fill="#4779a5"/></svg></div><div><b>${S.manager}</b><div class="small muted">Head Coach & Club Manager</div><p class="small">Your job is to build a winning club. Players do not need direct control — you make the decisions and the match engine calculates the result.</p><span class="tag">Manager career</span></div></div><h2>Latest club news</h2><div class="panel">${S.news}</div><h2>Honours cabinet</h2><div class="panel trophyline"><div class="trophy">🏆</div><div><b>${S.trophies.length} trophies won</b><div class="small muted">${S.trophies.join(' · ')||'Your first trophy is waiting.'}</div></div></div>`}
if(p==='squad'){a.innerHTML=`<h2>First-team squad · ${S.players.length} players</h2>${metrics()}<div class="panel">${S.players.map((x,i)=>`<div class="listrow"><div><b>${x.name}</b><div class="small muted">${x.pos} · ${x.age} years · Potential ${x.pot} · £${x.wage}k/week</div></div><span class="rating">${x.ovr}</span><button onclick="playerInfo(${i})">Details</button></div>`).join('')}</div>`}
if(p==='tactics'){a.innerHTML=`<h2>Team tactics</h2><div class="panel"><label>Formation</label><select id="formation"><option>4-2-3-1</option><option>4-3-3</option><option>4-4-2</option><option>3-5-2</option><option>5-3-2</option><option>4-1-4-1</option></select><label>Match approach</label><select id="style"><option>Balanced</option><option>Attacking</option><option>Defensive</option><option>Possession</option><option>Counter-attack</option><option>High press</option></select><h2>Starting XI preview</h2><div class="pitch"><div class="pos">LW · Nwosu</div><div class="pos">ST · Martin</div><div class="pos">RW · Ibrahim</div><div class="pos">AM · Williams</div><div class="pos">CM · Costa</div><div class="pos">DM · Bello</div><div class="pos">LB · James</div><div class="pos">CB · Adeyemi</div><div class="pos">CB · Silva</div><div class="pos">RB · Okoro</div><div class="pos" style="grid-column:2">GK · Mensah</div></div><p class="small muted">This is a tactical lineup preview. You manage the team; there is no player-control requirement.</p><button class="primary" style="width:100%" onclick="saveTactics()">Save match plan</button></div>`;$('formation').value=S.formation;$('style').value=S.style}
if(p==='matches'){let opp=S.opponents[(S.played)%S.opponents.length];a.innerHTML=`<h2>Match centre</h2>${metrics()}<div class="panel"><div class="row"><span class="tag">NEXT FIXTURE · LEAGUE</span><span class="small muted">Matchday ${S.played+1}</span></div><div class="fixture"><div><b>${S.club}</b><div class="small muted">Home</div></div><b>VS</b><div style="text-align:right"><b>${opp}</b><div class="small muted">Away</div></div></div><div class="small muted">Formation: ${S.formation} · Style: ${S.style}</div><p class="small">No need to control players. Select your match plan, then let the match simulator decide the result using squad strength, tactics and morale.</p><button class="primary" style="width:100%" onclick="playMatch()">▶ Simulate match</button><p class="notice">Last result: ${S.last}</p></div><h2>League record</h2><div class="panel grid"><div><span class="muted small">Played</span><h2>${S.played}</h2></div><div><span class="muted small">Points</span><h2>${S.points}</h2></div><div><span class="muted small">Wins</span><h2>${S.wins}</h2></div><div><span class="muted small">Draws / Losses</span><h2>${S.draws} / ${S.losses}</h2></div></div>`}
if(p==='transfers'){a.innerHTML=`<h2>Transfer market</h2>${metrics()}<div class="panel"><b>Available players</b>${S.market.map((x,i)=>`<div class="listrow"><div><b>${x.name}</b><div class="small muted">${x.pos} · ${x.age} years · Potential ${x.pot} · Rating ${x.ovr}</div></div><div><b>£${x.fee}m</b><div class="small muted">£${x.wage}k/wk</div></div><button onclick="buy(${i})">Sign</button></div>`).join('')}</div><h2>Sell a player</h2><div class="panel"><select id="sell">${S.players.map((x,i)=>`<option value="${i}">${x.name} · ${x.ovr} · ${x.pos}</option>`).join('')}</select><button class="gold" onclick="sell()">List and sell player</button></div>`}
if(p==='competitions'){a.innerHTML=`<h2>🏆 Tournament centre</h2><div class="hero"><div class="trophyline"><div class="trophy">🏆</div><div><b>Compete for silverware</b><div class="small">League titles, domestic cups and continental glory.</div></div></div></div><div class="panel" style="margin-top:10px">${S.comps.map((c,i)=>`<div class="listrow"><div style="font-size:24px">${c.icon}</div><div><b>${c.name}</b><div class="small muted">${c.kind} · Prize £${c.prize}m · ${c.status}</div></div><button ${c.status==='Locked'?'disabled':''} onclick="cup(${i})">Enter</button></div>`).join('')}</div><p class="notice">Continental cups and super cups unlock as your club earns qualification. This career prototype includes tournament entry and trophy tracking.</p>`}
if(p==='club'){a.innerHTML=`<h2>Club management</h2>${metrics()}<div class="panel"><b>Club identity</b><label class="small muted">Club name</label><input id="clubName" value="${S.club}"><label class="small muted">Manager name</label><input id="managerName" value="${S.manager}"><button onclick="saveClub()">Save club details</button></div><div class="panel" style="margin-top:9px"><b>Board objectives</b><p>• Finish in the league top half</p><p>• Reach a domestic cup semi-final</p><p>• Develop at least one young player</p><p>• Maintain a healthy wage budget</p><span class="tag">Board confidence ${S.rep}/5</span></div><div class="panel" style="margin-top:9px"><b>Facilities</b><div class="listrow"><span>Training ground</span><b>Level 2</b><button onclick="upgrade()">Upgrade £2m</button></div><div class="listrow"><span>Youth academy</span><b>Level 1</b><button onclick="academy()">Upgrade £2m</button></div></div>`}
if(p==='more'){a.innerHTML=`<h2>More club tools</h2><div class="grid"><button class="tile" onclick="show('training')">🏃<b>Training centre</b><small>Improve player development</small></button><button class="tile" onclick="show('competitions')">🏆<b>Trophy cabinet</b><small>Competition list and honours</small></button><button class="tile" onclick="show('table')">📊<b>League table</b><small>View your league position</small></button><button class="tile" onclick="show('settings')">⚙️<b>Career settings</b><small>Save, reset or restart</small></button></div>`}
if(p==='training'){a.innerHTML=`<h2>Training centre</h2><div class="panel"><label>Weekly focus</label><select id="focus"><option>Balanced</option><option>Fitness</option><option>Attacking</option><option>Defending</option><option>Passing</option><option>Youth development</option></select><button class="primary" style="width:100%" onclick="train()">Complete training week</button><p class="small muted">Training improves morale and can develop young players over time.</p></div>`}
if(p==='table'){a.innerHTML=`<h2>League table</h2><div class="panel"><div class="listrow"><b>Club</b><b>Pts</b><b>Played</b></div><div class="listrow"><b>${S.club}</b><span class="rating">${S.points}</span><span>${S.played}</span></div>${S.opponents.slice(0,7).map((o,i)=>`<div class="listrow"><span>${i+2}. ${o}</span><span>${Math.max(0,20-i*2+Math.floor(S.played/2))}</span><span>${S.played}</span></div>`).join('')}</div>`}
if(p==='settings'){a.innerHTML=`<h2>Career settings</h2><div class="panel"><p>Career progress is stored in this browser session. Keep this page available while playing.</p><button class="danger" onclick="if(confirm('Start a new career? Current progress will be lost.'))location.reload()">Start new career</button></div>`}
}
function playerInfo(i){let p=S.players[i];alert(`${p.name}\\nPosition: ${p.pos}\\nAge: ${p.age}\\nRating: ${p.ovr}\\nPotential: ${p.pot}\\nWage: £${p.wage}k/week`)}
function saveTactics(){S.formation=$('formation').value;S.style=$('style').value;S.news=`Tactics updated: ${S.formation} formation with a ${S.style.toLowerCase()} approach.`;show('tactics');alert('Match plan saved.')}
function playMatch(){let strength=avg()+(S.style==='Attacking'?2:S.style==='Defensive'?0:S.style==='Possession'?1:S.style==='High press'?1:0)+(S.morale-75)/8;let opposition=72+Math.random()*12;let home=Math.random()*1.2;let ours=Math.max(0,Math.round(Math.random()*2.2+(strength-opposition)/8+home));let theirs=Math.max(0,Math.round(Math.random()*2.0+(opposition-strength)/9));S.played++;if(ours>theirs){S.wins++;S.points+=3;S.cash+=.45;S.morale=Math.min(100,S.morale+4);S.rep=Math.min(5,S.rep+0.1)}else if(ours===theirs){S.draws++;S.points++;S.morale=Math.min(100,S.morale+1)}else{S.losses++;S.morale=Math.max(45,S.morale-4);S.rep=Math.max(1,S.rep-.1)}S.last=`${S.club} ${ours}–${theirs} ${S.opponents[(S.played-1)%S.opponents.length]}`;S.news=`Matchday ${S.played}: ${S.last}. The board is ${S.rep>=3?'satisfied':'watching your results closely'}.`;show('matches');alert(`FULL TIME\\n${S.last}\\n\\nLeague points: ${S.points}\\nTeam morale: ${S.morale}%`)}
function buy(i){let p=S.market[i];if(S.cash<p.fee){alert('Not enough transfer budget.');return}if(S.wages+p.wage>650){alert('The board will not approve a wage bill above £650k/week.');return}S.cash-=p.fee;S.wages+=p.wage;S.players.push({name:p.name,pos:p.pos,age:p.age,ovr:p.ovr,pot:p.pot,wage:p.wage});S.market.splice(i,1);S.news=`${p.name} has signed for ${S.club}.`;show('transfers')}
function sell(){let i=Number($('sell').value),p=S.players[i];if(S.players.length<=11){alert('You need at least 11 players in your squad.');return}let fee=Math.max(.2,(p.ovr-50)*.18);S.cash+=fee;S.wages-=p.wage;S.players.splice(i,1);S.news=`${p.name} has been sold for £${fee.toFixed(1)}m.`;show('transfers')}
function cup(i){let c=S.comps[i];if(c.status==='Locked')return;if(c.name==='Pre-season Invitational'){S.cash+=.3;c.status='Won';S.trophies.push(c.name);S.news='Harbour City have won the Pre-season Invitational!';alert('🏆 Tournament won! £0.3m prize money added.')}else{alert(`${c.name}\\nYou are registered. Tournament fixtures will be scheduled as this career develops.`)}show('competitions')}
function saveClub(){S.club=$('clubName').value.trim()||S.club;S.manager=$('managerName').value.trim()||S.manager;S.news='Club details updated.';show('club')}
function upgrade(){if(S.cash<2){alert('Not enough money.');return}S.cash-=2;S.news='Training ground upgraded. Better facilities will help player development.';alert('Training ground upgraded!');show('club')}
function academy(){if(S.cash<2){alert('Not enough money.');return}S.cash-=2;S.news='Youth academy upgraded. Your young players have better development support.';alert('Youth academy upgraded!');show('club')}
function train(){let focus=$('focus').value;S.training=focus;S.morale=Math.min(100,S.morale+3);let young=S.players.filter(p=>p.age<=21&&p.ovr<p.pot);if(focus==='Youth development'&&young.length){let p=young[Math.floor(Math.random()*young.length)];p.ovr++;S.news=`Training success: ${p.name} improved to ${p.ovr} rating.`}else S.news=`Training week completed: ${focus}. Team morale is now ${S.morale}%.`;show('training');alert(S.news)}
show('home');
</script></main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
\n</body></html>
